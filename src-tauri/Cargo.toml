[package]
name = "authenticator"
version = "1.0.0"
description = "Simple fast TOTP authenticator for Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "authenticator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "authenticator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
rqrr = "0.11"
xcap = "0.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
